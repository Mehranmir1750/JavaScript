<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="body">

  <div class="navbar">
    <h1 class="nav-h1">Quizora</h1>
  </div>

  <div class="level-score">
    <h3 class="level">Difficulty Level: Easy</h3>
    <h3 class="score">Score:0</h3>
    <h3 class="timer"><b>Timer: 00:00</b></h3>
  </div>

  <div class="question-body">
    <h2 class="question"><em>Which of the following is used to select an element in JavaScript?</em></h2>

    <div class="options">
      <button class="option">getElementById()</button>
      <button class="option">selectElement()</button>
      <button class="option">queryElement()</button>
      <button class="option">findElement()</button>
    </div>

    <button class="next">Next</button>
  </div>

  <div class="restart">
    <button class="restart-btn">Restart</button>
  </div>
  
</body>
</html>
